name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned Release app
        run: |
          set -euo pipefail

          xcodebuild \
            -project EPUBQuickLookHost.xcodeproj \
            -scheme EPUBQuickLookHost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      
      - name: Ad-hoc sign and package
        run: |
          set -euo pipefail

          APP="$PWD/build/DerivedData/Build/Products/Release/EPUBQuickLookHost.app"
          APPEX="$APP/Contents/PlugIns/EPUBQuickLook.appex"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements EPUBQuickLook/EPUBQuickLook.entitlements \
            "$APPEX"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements EPUBQuickLookHost/EPUBQuickLookHost.entitlements \
            "$APP"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            dist/EPUBQuickLookHost.zip

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: EPUBQuickLookHost-macOS
          path: dist/EPUBQuickLookHost.zip
          if-no-files-found: error
          retention-days: 30
